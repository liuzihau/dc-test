[program:dcache_benchmark_v2]
command=/bin/bash /workspace/dc-test/scripts/reasoning/run_benchmark_aligned.sh run --gpu 0 --hours 10 --deadline-from /workspace/dc-test/outputs/reasoning/queues/zebra-continuation-5k-10k-v1/budget.json
directory=/workspace/dc-test
environment=PROC_NAME="dcache_benchmark_v2",DCACHE_PYTHON="/venv/main/bin/python",PATH="/venv/main/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",PYTHONDONTWRITEBYTECODE="1",PYTHONUNBUFFERED="1"
# Retired after Zebra both_aux; the full-epoch queue owns the next GPU jobs.
autostart=false
autorestart=false
startsecs=3
startretries=0
stopsignal=INT
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
