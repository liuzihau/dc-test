[program:dcache_second_epoch]
command=/bin/bash /workspace/dc-test/scripts/reasoning/run_second_epoch.sh run --gpu 0
directory=/workspace/dc-test
environment=PROC_NAME="dcache_second_epoch",DCACHE_PYTHON="/venv/main/bin/python",PATH="/venv/main/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",PYTHONDONTWRITEBYTECODE="1",PYTHONUNBUFFERED="1"
autostart=true
autorestart=false
startsecs=3
startretries=0
stopsignal=INT
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
