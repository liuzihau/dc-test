name: dvar-medium
type: ddit
hidden_size: 1024
cond_dim: 128
length: 1024
n_blocks: 24
n_heads: 16
scale_by_sigma: True
dropout: 0.1
tie_word_embeddings: true  # Enabled to match diffusion-vs-ar's GPT-2
use_rope: false  # Disabled to match diffusion-vs-ar's GPT-2 (absolute pos only)
lr: 3e-4  # Recommended LR for small/medium models (per diffusion-vs-ar paper)
