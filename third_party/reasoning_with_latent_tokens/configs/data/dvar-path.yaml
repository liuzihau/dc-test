# Diffusion-vs-AR Path Finding dataset
# Graph path finding problems
name: dvar-path
train: synthetic
valid: synthetic
tokenizer_name_or_path: dvar-path
cache_dir: null  # Set via environment

wrap: True
streaming: True
insert_train_eos: True
insert_valid_eos: True

# Data file paths (relative to project root)
train_data_path: diffusion-vs-ar/data/path_train.jsonl
valid_data_path: diffusion-vs-ar/data/path_test.jsonl

# Vocabulary config (19 tokens)
# Tokens: PAD(0), BOS(1), EOS(2), SEP(3), '/'(4), ','(5), '-'(6),
#         0-9(7-16), 10(17), 11(18)
vocab_size: 19
